[package]
name = "mybot-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP sidecar for bot4cj: exposes `mybot --mcp-backend` tools over MCP (stdio) to any MCP client"
license = "MIT"

# F-生态（方案 F / 拓扑 F3）：本 sidecar 对上说 MCP（stdio），对下说 mybot 后端的
# pymsg 兼容帧（AF_UNIX）。它**不**链接任何 C++、**不**含 rig（不当 agent loop），
# 只做协议翻译。见 .tmp/bot4cj-mcp-option-f-20260924.md 与 plans/empty-stream-dace.md。

[[bin]]
name = "mybot-mcp"
path = "src/main.rs"

[dependencies]
# 钉精确版本：API 面按 2.2.0 源码核对（/tmp/rigcheck/rmcp-2.2.0）。
# 只开 server + transport-io（stdio）；default 已含 base64/macros/server，
# 不引入 reqwest/rustls/tokio-stream 等客户端-HTTP 重依赖。
rmcp = { version = "=2.2.0", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 2
lto = "thin"
