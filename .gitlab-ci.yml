# bot4cj CI（F-22）：最小门禁——构建 + 全量守门 + sanitizer 双跑。
# GitCode（GitLab 系托管）经 .gitlab-ci.yml 驱动；若托管方不识别本文件
# 则静默不生效（无副作用），迁移其它平台时按同结构翻译即可。
#
# 与本地 pre-push 钩子同一条守门（test/run_all.sh），CI 的职责是让
# 「守门通过」成为自动结论，而非依赖开发者手工跑绿后推送。

stages:
  - build
  - gate

variables:
  DEBIAN_FRONTEND: noninteractive

.install-deps: &install-deps
  - apt-get update -qq
  - apt-get install -y -qq cmake g++ libluajit-5.1-dev luajit python3

build:release:
  stage: build
  image: debian:bookworm
  before_script: *install-deps
  script:
    - cmake -S . -B build && cmake --build build -j"$(nproc)"
  artifacts:
    paths:
      - build

gate:release:
  stage: gate
  image: debian:bookworm
  needs: ["build:release"]
  before_script: *install-deps
  script:
    - bash test/run_all.sh

gate:sanitizer:
  stage: gate
  image: debian:bookworm
  needs: ["build:release"]
  before_script: *install-deps
  script:
    # run_san.sh 第二跑要求 build-asan 产物（explicit=1 缺产物即判失败），
    # 故本 job 必须自建 sanitizer 产物——只继承 build:release 的 Release 产物不够。
    - cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DMYBOT_SANITIZE=address,undefined
    - cmake --build build-asan -j"$(nproc)"
    - bash test/run_san.sh

# TSan 常态化（审计覆盖缺口 #1，起步为软门禁）：只跑 mybot_tests 的守护
# 相关用例（并发压测 + 状态机分支），不跑整段守门——LuaJIT 未按 TSan
# 清洁维护，全量跑的误报无信号价值（tsan.supp 已按库抑制残留噪声）。
# allow_failure 观察若干轮、告警收敛后移除该行转硬门禁。
gate:tsan:
  stage: gate
  image: debian:bookworm
  needs: ["build:release"]
  allow_failure: true
  before_script: *install-deps
  script:
    - cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DMYBOT_SANITIZE=thread
    - cmake --build build-tsan -j"$(nproc)"
    - TSAN_OPTIONS="suppressions=$(pwd)/tsan.supp halt_on_error=0" ./build-tsan/mybot_tests daemon_concurrent
    - TSAN_OPTIONS="suppressions=$(pwd)/tsan.supp halt_on_error=0" ./build-tsan/mybot_tests daemon_multi_runner
    - TSAN_OPTIONS="suppressions=$(pwd)/tsan.supp halt_on_error=0" ./build-tsan/mybot_tests daemon_stop_and_exit
