<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
  <title>主页 - 移动端适配版</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  
  <!-- Tailwind 配置（增加移动端断点优化） -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3b82f6',
            secondary: '#06b6d4',
            dark: {
              900: '#0f172a',
              800: '#1e293b',
            }
          },
          fontFamily: {
            inter: ['Inter', 'system-ui', 'sans-serif'],
          },
          screens: {
            'xs': '480px',
            'sm': '640px',
            'md': '768px',
            'lg': '1024px',
          }
        },
      }
    }
  </script>
  
  <!-- 自定义工具类 -->
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .text-gradient {
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
      }
      .grid-bg {
        background-image: linear-gradient(to right, #80808015 1px, transparent 1px),
                          linear-gradient(to bottom, #80808015 1px, transparent 1px);
        background-size: 24px 24px;
      }
    }
  </style>
  
  <style>
    /* 全局样式 + 移动端增强 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    /* 滚动条样式 */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    
    ::-webkit-scrollbar-thumb {
      background: rgba(59, 130, 246, 0.3);
      border-radius: 3px;
    }
    
    /* 淡入上移动画 (保留原有效果) */
    @keyframes fadeUp {
      0% {
        opacity: 0;
        transform: translateY(50px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .animate-fade-up {
      opacity: 0;
      animation: fadeUp 0.8s ease-out forwards;
    }
    
    .animate-fade-up-delay {
      opacity: 0;
      animation: fadeUp 0.8s ease-out 0.3s forwards;
    }
    
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    .animate-bounce {
      animation: bounce 2s ease-in-out infinite;
    }
    
    /* 移动端触摸优化 */
    button, [role="button"] {
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* 移动端内容容器安全区域 */
    .container {
      width: 100%;
      margin-left: auto;
      margin-right: auto;
      padding-left: 1rem;
      padding-right: 1rem;
    }
    
    /* 手机横屏及小屏特别优化 */
    @media (max-width: 640px) {
      .min-h-[900px] {
        min-height: 100vh !important;
      }
      .text-4xl {
        font-size: 2rem;
        line-height: 1.25;
      }
      .py-12 {
        padding-top: 2rem;
        padding-bottom: 2rem;
      }
      .gap-12 {
        gap: 2rem;
      }
      .rounded-2xl {
        border-radius: 1rem;
      }
      .px-8 {
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }
      /* 光晕效果在移动端减弱避免性能问题 */
      .blur-\[120px\] {
        filter: blur(60px);
      }
    }
    
    @media (max-width: 480px) {
      .text-4xl {
        font-size: 1.75rem;
      }
      .text-lg {
        font-size: 0.95rem;
      }
      .mb-6 {
        margin-bottom: 1rem;
      }
      .px-4 {
        padding-left: 0.75rem;
        padding-right: 0.75rem;
      }
    }
    
    /* 保留原有图片缩放效果，且移动端平滑 */
    .group-hover\:scale-105:hover {
      transform: scale(1.05);
    }
    @media (max-width: 768px) {
      .group-hover\:scale-105 {
        transform: scale(1);
      }
      .group:active .group-hover\:scale-105 {
        transform: scale(1.02);
        transition: transform 0.2s;
      }
    }
    
    /* 按钮按下反馈 */
    .active\:scale-98:active {
      transform: scale(0.98);
    }
    
    /* 主题切换按钮移动端位置调整 */
    @media (max-width: 640px) {
      .fixed.top-4.right-4 {
        top: 12px;
        right: 12px;
      }
      .fixed.top-4.right-4 button {
        width: 40px;
        height: 40px;
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 min-h-screen transition-colors duration-300">
  <!-- 主题切换按钮 (位置微调，功能不变) -->
  <div class="fixed top-4 right-4 z-50">
    <button id="theme-toggle" class="p-2 rounded-full bg-white/90 dark:bg-gray-800/90 backdrop-blur-sm shadow-lg border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-all duration-200 w-10 h-10 flex items-center justify-center">
      <i class="fas fa-sun" id="theme-icon"></i>
    </button>
  </div>
  
  <!-- 科技感主页内容 - 完全保留原始结构，仅布局响应式增强 -->
  <div class="min-h-[900px] w-full relative overflow-hidden flex items-center justify-center bg-gradient-to-br from-blue-50 via-indigo-50 to-gray-100 dark:bg-gradient-to-br dark:from-gray-900 dark:via-blue-950 dark:to-black transition-colors duration-500">
    <!-- 背景网格效果 -->
    <div class="absolute inset-0 opacity-20 pointer-events-none">
      <div class="h-full w-full grid-bg"></div>
    </div>
    
    <!-- 科技感光晕效果（移动端缩小模糊半径优化性能） -->
    <div class="absolute top-1/4 -left-20 w-72 h-72 md:w-96 md:h-96 bg-blue-500 rounded-full filter blur-[60px] md:blur-[120px] opacity-20"></div>
    <div class="absolute bottom-1/4 -right-20 w-72 h-72 md:w-96 md:h-96 bg-purple-500 rounded-full filter blur-[60px] md:blur-[120px] opacity-20"></div>
    
    <div class="container mx-auto px-4 sm:px-6 py-8 md:py-12 relative z-10">
      <!-- 移动端：flex-col-reverse 在极小屏上图片在上更符合视觉? 但原设计是左图右文，保持flex-col md:flex-row 自然适配 -->
      <div class="flex flex-col md:flex-row items-center justify-center gap-8 md:gap-12 max-w-7xl mx-auto">
        <!-- 科技感图片区域 (移动端圆角略小，动画保留) -->
        <div class="w-full md:w-1/2 animate-fade-up">
          <div class="relative rounded-xl md:rounded-2xl overflow-hidden group shadow-xl shadow-blue-900/20 border border-blue-500/10 bg-gray-100 dark:bg-gray-800/30">
            <div class="absolute inset-0 bg-gradient-to-tr from-blue-500/20 to-purple-500/20 opacity-0 group-hover:opacity-100 transition-opacity duration-300 z-10 pointer-events-none"></div>
            <img 
              src="https://space.coze.cn/api/coze_space/gen_image?image_size=landscape_16_9&prompt=High%20tech%20futuristic%20city%20skyline%20at%20night%20with%20neon%20lights%20digital%20technology%20concept&sign=2dc70143bdb9ed9b6d1821d0fc0430e7" 
              alt="科技感未来城市" 
              class="w-full h-auto object-cover rounded-xl md:rounded-2xl transform transition-transform duration-500 group-hover:scale-105 will-change-transform"
              loading="eager"
            />
            <div class="absolute inset-0 bg-gradient-to-t from-black/40 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none"></div>
          </div>
        </div>
        
        <!-- 标语文字区域（移动端文字居中，间距调整） -->
        <div class="w-full md:w-1/2 text-center md:text-left animate-fade-up-delay">
          <div class="inline-flex px-4 py-1.5 rounded-full bg-gradient-to-r from-blue-500/20 to-purple-500/20 text-blue-600 dark:text-blue-400 text-xs sm:text-sm font-medium mb-5 md:mb-6 border border-blue-500/30 backdrop-blur-sm">
            <span class="flex items-center gap-2">
              <i class="fas fa-lightbulb text-sm"></i>
              <span>未来科技 · 移动优先</span>
            </span>
          </div>
          
          <h1 class="text-3xl xs:text-4xl sm:text-5xl md:text-5xl lg:text-6xl font-bold mb-4 md:mb-6 leading-tight bg-gradient-to-r from-gray-900 via-blue-700 to-cyan-700 dark:from-white dark:via-blue-300 dark:to-cyan-300 text-gradient">
            创新科技<br class="hidden sm:block" />塑造未来世界
          </h1>
          
          <p class="text-base sm:text-lg mb-6 md:mb-8 max-w-lg mx-auto md:mx-0 text-gray-600 dark:text-gray-300 px-2 sm:px-0">
            探索前沿科技如何改变我们的生活方式，连接人与数字世界的无限可能，开启智能未来的新篇章。
          </p>
          
          <!-- 按钮触屏优化，点击区域增大 -->
          <button id="explore-btn" class="px-6 sm:px-8 py-2.5 sm:py-3 rounded-full bg-gradient-to-r from-blue-600 to-cyan-500 text-white font-medium shadow-lg shadow-blue-500/30 hover:shadow-blue-500/50 transition-all duration-300 border border-blue-400/20 hover:scale-105 active:scale-95 text-sm sm:text-base">
            开始探索 <i class="fas fa-arrow-right ml-2"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    // ========== 主题切换功能（完全保留原始逻辑，无任何接口变更） ==========
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    
    // 初始化主题
    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'light';
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      // 根据保存的设置决定是否暗色模式
      let isDark = false;
      if (savedTheme === 'dark') isDark = true;
      else if (savedTheme === 'auto') isDark = prefersDark;
      else if (savedTheme === 'light') isDark = false;
      else isDark = false;
      
      document.documentElement.classList.toggle('dark', isDark);
      updateThemeIcon(isDark ? 'dark' : 'light');
    }
    
    // 更新主题图标
    function updateThemeIcon(theme) {
      if (theme === 'dark') {
        themeIcon.className = 'fas fa-moon';
      } else {
        themeIcon.className = 'fas fa-sun';
      }
    }
    
    // 切换主题
    function toggleTheme() {
      const isDark = document.documentElement.classList.contains('dark');
      const newTheme = isDark ? 'light' : 'dark';
      
      document.documentElement.classList.toggle('dark', !isDark);
      localStorage.setItem('theme', newTheme);
      updateThemeIcon(newTheme);
    }
    
    // 监听系统主题变化（保留原始行为）
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      const savedTheme = localStorage.getItem('theme');
      // 如果用户没有主动设置过主题，或者设置为auto，跟随系统
      if (!savedTheme || savedTheme === 'auto') {
        const shouldBeDark = e.matches;
        document.documentElement.classList.toggle('dark', shouldBeDark);
        updateThemeIcon(shouldBeDark ? 'dark' : 'light');
      }
    });
    
    // 开始探索按钮事件 - 完全保持不变（跳转到根目录）
    const exploreBtn = document.getElementById('explore-btn');
    if (exploreBtn) {
      exploreBtn.addEventListener('click', function() {
        window.location.href = '/';
      });
    }
    
    // 主题切换事件监听
    if (themeToggle) {
      themeToggle.addEventListener('click', toggleTheme);
    }
    
    // 初始化
    initTheme();
    
    // 移动端额外优化：确保触摸时不会有300ms延迟（现代浏览器已无此问题，但保留平滑滚动）
    // 增强图片懒加载兼容（保持原有链接，无改动）
    if ('loading' in HTMLImageElement.prototype) {
      const images = document.querySelectorAll('img[loading="lazy"]');
      images.forEach(img => {
        img.setAttribute('loading', 'eager');
      });
    }
    
    // 增加移动端横屏检测调整字体（可选，提升体验但不影响功能）
    function handleOrientation() {
      const isLandscape = window.innerWidth > window.innerHeight;
      const title = document.querySelector('h1');
      if (title && window.innerWidth <= 768 && isLandscape) {
        title.classList.add('text-3xl');
      } else if (title && window.innerWidth <= 768) {
        title.classList.remove('text-3xl');
      }
    }
    window.addEventListener('resize', handleOrientation);
    handleOrientation();
  </script>
</body>
</html>
