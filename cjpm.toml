[package]
  cjc-version = "1.0.4"
  name = "bot4cj"
  description = "nothing here"
  version = "1.0.0"
  target-dir = ""
  src-dir = ""
  output-type = "executable"
  compile-option = "-l c -l pthread" # Linux
  override-compile-option = ""
  link-option = ""
  package-configuration = {}

